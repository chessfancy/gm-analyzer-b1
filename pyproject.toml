[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chessgrandmaster-analyzer"
version = "0.1.0"
description = "Portable Lucas-compatible chess analysis pipeline for ChessGrandmaster"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-chess>=1.999",
]

[project.scripts]
cgm-analyze = "chessgrandmaster.cli:main"
cgm-engine = "chessgrandmaster.engine_manifest:main"
cgm-bench = "chessgrandmaster.benchmark_cli:main"
cgm-acquire = "chessgrandmaster.b2.cli_acquire:main"
cgm-registry = "chessgrandmaster.b2.cli_registry:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chessgrandmaster = ["engine.toml"]
"chessgrandmaster.discovery" = ["data/*.txt", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
